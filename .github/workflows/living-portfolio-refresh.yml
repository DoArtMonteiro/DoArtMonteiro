name: Refresh living portfolio

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/living-portfolio-refresh.yml"
      - "assets/campaigns/**"
      - "assets/project-repositories.json"
      - "scripts/living_portfolio/**"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-portfolio-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Python runtime
        run: python3 --version

      - name: Run deterministic generator and publication tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate a live public-data bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.living_portfolio.preview
          --output-dir "$RUNNER_TEMP/living-portfolio-preview"
          --refresh-mode live

      - name: Upload the validated bundle for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: living-portfolio-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/living-portfolio-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Report generation outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Living portfolio generation"
            echo
            echo "Generation job status: ${JOB_STATUS}."
            echo
            echo "The generator uses GitHub's public contribution fields and exact public-repository allowlist. A failed collection or validation cannot update the asset branch."
            echo
            echo "[Open this workflow run](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: generate
    if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the default branch without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the validated bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: living-portfolio-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/living-portfolio-preview

      - name: Publish assets to the portfolio-assets branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 -m scripts.living_portfolio.publish
          --source-dir "$RUNNER_TEMP/living-portfolio-preview"

      - name: Report refresh outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Living portfolio refresh"
            echo
            echo "Publication job status: ${JOB_STATUS}."
            echo
            echo "Generated assets come from the public GraphQL contribution calendar and the exact repository allowlist. A failed generation or validation leaves the previous portfolio-assets revision intact."
            echo
            echo "[Open this workflow run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
