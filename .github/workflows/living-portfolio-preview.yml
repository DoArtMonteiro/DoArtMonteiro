name: Living portfolio preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: living-portfolio-preview-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact review revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify Python runtime
        run: python3 --version

      - name: Run deterministic generator tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate an unpublished preview from public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.living_portfolio.preview
          --output-dir "$RUNNER_TEMP/living-portfolio-preview"

      - name: Upload the diagnostic preview for review
        id: upload_preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: living-portfolio-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/living-portfolio-preview/
          if-no-files-found: error
          retention-days: 7

      - name: Record preview outcome and stale-data guidance
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_STATUS: ${{ steps.upload_preview.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            {
              echo "## Living portfolio preview"
              echo
              echo "The data-backed preview completed on the runner. A diagnostic artifact is available for seven days; it is separate from the profile README assets. No README asset was committed and no application was deployed."
              echo
              echo "The asset manifest links each visual to its source and records the 36-hour stale-data rule. This run's timestamp is the operational refresh record."
              echo
              echo "[Open this workflow run]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Living portfolio preview failed"
              echo
              echo "The public profile and any last-valid published bundle remain unchanged. Its data-through date continues to age and becomes stale after 36 hours."
              echo
              if [ "$ARTIFACT_STATUS" = "success" ]; then
                echo "A diagnostic artifact is available for seven days."
              else
                echo "No diagnostic artifact is available because generation or artifact upload did not complete successfully."
              fi
              echo
              echo "Inspect the failed step, repair the source or validator, then dispatch a new preview."
              echo
              echo "[Open this workflow run]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
