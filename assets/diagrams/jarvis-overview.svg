<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 190" role="img" aria-labelledby="title desc">
  <title id="title">JARVIS / Donna trust boundaries</title>
  <desc id="desc">Donna or the CLI sends typed requests to a Rust policy core, which checks approvals before dispatching work to an isolated worker and bounded tools.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#62d7ce"/></marker></defs>
  <rect width="1120" height="190" rx="14" fill="#0d1928"/>
  <text x="34" y="34" fill="#f0b75d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOCAL RUNTIME · POLICY BEFORE EFFECT</text>
  <g fill="#172b40" stroke="#62d7ce" stroke-width="2"><rect x="32" y="64" width="224" height="70" rx="9"/><rect x="304" y="64" width="224" height="70" rx="9"/><rect x="576" y="64" width="224" height="70" rx="9"/><rect x="848" y="64" width="240" height="70" rx="9" stroke="#f0b75d"/></g>
  <g fill="#f1f5f8" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><text x="144" y="94"><tspan x="144">Person</tspan><tspan x="144" dy="23">Donna / CLI</tspan></text><text x="416" y="94"><tspan x="416">Rust policy</tspan><tspan x="416" dy="23">core + approval</tspan></text><text x="688" y="94"><tspan x="688">Isolated</tspan><tspan x="688" dy="23">worker</tspan></text><text x="968" y="94"><tspan x="968">Typed tools</tspan><tspan x="968" dy="23">bounded effects</tspan></text></g>
  <g fill="none" stroke="#62d7ce" stroke-width="2" marker-end="url(#arrow)"><path d="M256 99H296"/><path d="M528 99H568"/><path d="M800 99H840"/></g>
  <text x="34" y="164" fill="#aebdcc" font-family="Arial,sans-serif" font-size="14">A separate Windows Session Agent handles approved clipboard writes outside the worker sandbox.</text>
</svg>
