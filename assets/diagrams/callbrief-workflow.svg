<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">CallBrief evidence-linked assessment flow</title>
  <desc id="desc">Selected public sources pass through adapters into a provenance-aware catalogue. An organisation profile and explicit eligibility rules produce an evidence-linked assessment and local HTML report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="1" stop-color="#0a1522"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64d9d1"/>
    </marker>
  </defs>
  <rect width="1200" height="250" rx="14" fill="url(#bg)"/>
  <g fill="#14283b" stroke="#5bd3cc" stroke-width="2">
    <rect x="34" y="83" width="190" height="76" rx="10"/>
    <rect x="270" y="83" width="180" height="76" rx="10"/>
    <rect x="496" y="83" width="204" height="76" rx="10"/>
    <rect x="746" y="83" width="190" height="76" rx="10"/>
    <rect x="982" y="83" width="184" height="76" rx="10" stroke="#edb65e"/>
  </g>
  <g fill="#f0f4f7" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="129" y="116"><tspan x="129">Selected public</tspan><tspan x="129" dy="25">sources</tspan></text>
    <text x="360" y="116"><tspan x="360">Source</tspan><tspan x="360" dy="25">adapters</tspan></text>
    <text x="598" y="116"><tspan x="598">Catalogue +</tspan><tspan x="598" dy="25">source evidence</tspan></text>
    <text x="841" y="116"><tspan x="841">Profile + explicit</tspan><tspan x="841" dy="25">eligibility rules</tspan></text>
    <text x="1074" y="116"><tspan x="1074">Evidence-linked</tspan><tspan x="1074" dy="25">assessment</tspan></text>
  </g>
  <g fill="none" stroke="#64d9d1" stroke-width="2" marker-end="url(#arrow)">
    <path d="M224 121H263"/><path d="M450 121H489"/><path d="M700 121H739"/><path d="M936 121H975"/>
  </g>
  <path d="M841 159V194H1074V166" fill="none" stroke="#edb65e" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="957" y="222" fill="#d9c08d" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">Local HTML report · missing evidence remains uncertain</text>
  <text x="40" y="48" fill="#9db1c5" font-family="Arial,sans-serif" font-size="14" letter-spacing="1.5">LOCAL PYTHON CLI PROTOTYPE · NOT A HOSTED SERVICE</text>
</svg>
