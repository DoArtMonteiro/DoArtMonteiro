<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 220" role="img" aria-labelledby="title desc">
  <title id="title">Alibi puzzle-solving flow</title>
  <desc id="desc">Read room, furniture and relationship clues; place each suspect in a unique row and column; identify the suspect left alone with the victim.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f0e7"/>
      <stop offset="1" stop-color="#e8e1d4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#9c6416"/>
    </marker>
  </defs>
  <rect width="1080" height="220" rx="14" fill="url(#paper)"/>
  <text x="40" y="42" fill="#6a4a1b" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">ALIBI · PUZZLE LOGIC</text>
  <g fill="#fbf9f4" stroke="#72817d" stroke-width="2">
    <rect x="40" y="72" width="280" height="92" rx="10"/>
    <rect x="400" y="72" width="280" height="92" rx="10"/>
    <rect x="760" y="72" width="280" height="92" rx="10" stroke="#9c6416"/>
  </g>
  <g fill="#273735" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <text x="180" y="111"><tspan x="180">Read witness clues</tspan><tspan x="180" dy="29" font-size="16" font-weight="400">Rooms · furniture · relationships</tspan></text>
    <text x="540" y="111"><tspan x="540">Place each suspect</tspan><tspan x="540" dy="29" font-size="16" font-weight="400">One per row and column</tspan></text>
    <text x="900" y="111"><tspan x="900">Make the accusation</tspan><tspan x="900" dy="29" font-size="16" font-weight="400">Find who remains with the victim</tspan></text>
  </g>
  <g fill="none" stroke="#9c6416" stroke-width="3" marker-end="url(#arrow)">
    <path d="M320 118H390"/><path d="M680 118H750"/>
  </g>
</svg>
